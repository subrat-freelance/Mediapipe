<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xebit-vision demo</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.4 system-ui, sans-serif;
        --line: color-mix(in srgb, currentColor 18%, transparent);
        --dim: color-mix(in srgb, currentColor 55%, transparent);
        --amber: #e8a200;
        --amber-bg: color-mix(in srgb, #e8a200 16%, transparent);
        --green: #16a34a;
      }
      body { margin: 0; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(280px, 560px) minmax(300px, 1fr); align-items: start; }
      @media (max-width: 820px) { body { grid-template-columns: 1fr; } }
      .stage { position: relative; background: #000; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; }
      .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; }
      .controls input[type="text"] { flex: 1; min-width: 200px; font: inherit; padding: 4px 6px; }
      button { font: inherit; padding: 6px 18px; border-radius: 6px; }

      /* Dashboard */
      .status { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
      .status .state { font-weight: 600; }
      .status .muted { color: var(--dim); font-variant-numeric: tabular-nums; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
      .tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; transition: background 0.15s, border-color 0.15s; }
      .tile .label { display: flex; align-items: center; gap: 7px; font-weight: 500; }
      .tile .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
      .tile .detail { color: var(--dim); font-size: 12px; margin-top: 3px; min-height: 1em; font-variant-numeric: tabular-nums; }
      .tile.live { border-color: var(--amber); }
      .tile.live .dot { background: var(--amber); }
      .tile.on { background: var(--amber-bg); border-color: var(--amber); }
      .tile.on .dot { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-bg); }
      .tile.people .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }

      .feed-h { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 6px; }
      .feed-h h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); }
      ul#feed { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; }
      ul#feed li { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px solid var(--line); }
      ul#feed li .t { color: var(--dim); }
      ul#feed li .s-start { color: var(--amber); font-weight: 600; }
      ul#feed li .s-end { color: var(--dim); }
      ul#feed .empty { color: var(--dim); border: 0; }

      details { margin-top: 14px; }
      summary { cursor: pointer; color: var(--dim); }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; margin: 10px 0; font-variant-numeric: tabular-nums; }
      dt { opacity: 0.7; }
      dd { margin: 0; }
      pre { margin: 0; padding: 8px; max-height: 50vh; overflow: auto; font: 12px/1.35 ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 6px; }
    </style>
  </head>
  <body>
    <section>
      <div class="stage">
        <video id="preview" muted playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="controls">
        <button id="toggle">Start</button>
        <label><input id="draw" type="checkbox" checked /> Draw landmarks</label>
        <label><input id="mesh" type="checkbox" /> Face mesh</label>
        <label><input id="objects" type="checkbox" checked /> Detect phone/objects</label>
      </div>
      <div class="controls">
        <label for="rx">Receiver</label>
        <input id="rx" type="text" placeholder="http://localhost:8787 — empty: count only, send nowhere" />
      </div>
    </section>

    <section>
      <div class="status">
        <span class="state" id="state">idle</span>
        <span class="muted" id="status-extra"></span>
      </div>

      <div class="tiles" id="tiles">
        <div class="tile people" id="tile-people">
          <div class="label"><span class="dot" style="background:transparent"></span>People</div>
          <div class="big" id="people-count">—</div>
        </div>
        <!-- event tiles injected by main.ts -->
      </div>

      <div class="feed-h">
        <h3>Events</h3>
        <span class="muted" id="feed-count">0</span>
      </div>
      <ul id="feed"><li class="empty">No events yet. Start, then raise a hand or hold up a phone.</li></ul>

      <details>
        <summary>Technical detail</summary>
        <dl>
          <dt>Receiver</dt><dd id="link">—</dd>
          <dt>Sent / dropped</dt><dd id="counts">0 / 0</dd>
          <dt>Frames per second</dt><dd id="fps">—</dd>
          <dt>Last infer_ms</dt><dd id="infer">—</dd>
          <dt>Last message</dt><dd id="bytes">—</dd>
          <dt>Bytes per second</dt><dd id="bps">—</dd>
          <dt>Poses / faces</dt><dd id="poses">—</dd>
          <dt>Objects</dt><dd id="objects-out">—</dd>
        </dl>
        <pre id="json"></pre>
      </details>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
